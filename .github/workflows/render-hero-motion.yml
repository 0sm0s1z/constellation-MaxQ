name: Render hero motion

on:
  push:
    branches:
      - web/original-layered-flame-reveal
    paths:
      - tools/render_hero_motion.py
      - .github/workflows/render-hero-motion.yml
      - web/public/art/rocket-layers/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/original-layered-flame-reveal
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install compositor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render original-layer hero frames and poster
        run: python tools/render_hero_motion.py

      - name: Validate CEO last-chance architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          art = Path("web/public/art/rocket-layers")
          required = [
              "plate.webp",
              "rocket-trim.webp",
              "flame-trail.webp",
              "smoke-puff-01.webp",
              "smoke-puff-02.webp",
              "smoke-puff-03.webp",
              "smoke-puff-04.webp",
          ]
          for name in required:
              path = art / name
              assert path.is_file(), path
              Image.open(path).verify()

          script = Path("tools/render_hero_motion.py").read_text()
          for banned in (
              "hero-pad-plume",
              "hero-exhaust-shaft",
              "warpAffine",
              "getAffineTransform",
              "rocket-frames",
          ):
              assert banned not in script, banned
          assert 'flame-trail.webp' in script
          assert 'smoke-puff-' in script

          frames = Path(".hero-motion-frames")
          for frame in ("f0000.png", "f0045.png", "f0072.png", "f0144.png"):
              assert (frames / frame).is_file(), frame

          print("PASS: original static puffs + original flame-trail crop/reveal + rocket lift")
          PY

      - name: Encode transparent VP9 WebM
        run: |
          ffmpeg -y \
            -framerate 24 \
            -i .hero-motion-frames/f%04d.png \
            -c:v libvpx-vp9 \
            -pix_fmt yuva420p \
            -auto-alt-ref 0 \
            -b:v 0 \
            -crf 30 \
            -deadline good \
            -cpu-used 2 \
            web/public/art/hero-launch.webm

      - name: Verify render
        run: |
          test -s web/public/art/hero-launch.webm
          test -s web/public/art/hero-launch-poster.webp
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,pix_fmt,duration \
            -of default=noprint_wrappers=1 \
            web/public/art/hero-launch.webm

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/art/hero-launch.webm web/public/art/hero-launch-poster.webp
          if git diff --cached --quiet; then
            echo "Rendered assets unchanged"
            exit 0
          fi
          git commit -m "fix(web): render original plume + flame-trail hero"
          git push origin HEAD:web/original-layered-flame-reveal
