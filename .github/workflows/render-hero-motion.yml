name: Render hero motion

on:
  push:
    branches:
      - web/rendered-hero-motion
    paths:
      - tools/render_hero_motion.py
      - .github/workflows/render-hero-motion.yml
      - web/public/art/rocket-layers/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/rendered-hero-motion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install compositor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render source frames and poster
        run: python tools/render_hero_motion.py

      - name: Encode transparent VP9 WebM
        run: |
          ffmpeg -y \
            -framerate 24 \
            -i .hero-motion-frames/f%04d.png \
            -c:v libvpx-vp9 \
            -pix_fmt yuva420p \
            -auto-alt-ref 0 \
            -b:v 0 \
            -crf 30 \
            -deadline good \
            -cpu-used 2 \
            web/public/art/hero-launch.webm

      - name: Verify render
        run: |
          test -s web/public/art/hero-launch.webm
          test -s web/public/art/hero-launch-poster.webp
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,pix_fmt,duration \
            -of default=noprint_wrappers=1 \
            web/public/art/hero-launch.webm

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/art/hero-launch.webm web/public/art/hero-launch-poster.webp
          if git diff --cached --quiet; then
            echo "Rendered assets unchanged"
            exit 0
          fi
          git commit -m "feat(web): render finished hero motion asset"
          git push origin HEAD:web/rendered-hero-motion
