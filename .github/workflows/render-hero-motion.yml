name: Render hero motion

on:
  push:
    branches:
      - web/hero-art-match-sot
    paths:
      - tools/render_hero_motion.py
      - .github/workflows/render-hero-motion.yml
      - web/public/art/hero-pad-plume.webp
      - web/public/art/hero-exhaust-shaft.webp
      - web/public/art/rocket-layers/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/hero-art-match-sot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install compositor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render corrected source frames and poster
        run: python tools/render_hero_motion.py

      - name: Validate SoT art and geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("web/public/art")
          pad = Image.open(root / "hero-pad-plume.webp").convert("RGBA")
          shaft = Image.open(root / "hero-exhaust-shaft.webp").convert("RGBA")
          assert pad.size == (210, 104), pad.size
          assert shaft.size == (56, 320), shaft.size
          assert pad.getchannel("A").getextrema()[0] < 255
          assert shaft.getchannel("A").getextrema()[0] < 255
          frames = Path(".hero-motion-frames")
          assert (frames / "f0000.png").is_file()
          assert (frames / "f0045.png").is_file()
          assert (frames / "f0072.png").is_file()
          assert (frames / "f0144.png").is_file()
          print("PASS: dense static pad plume + fixed-profile crop-revealed shaft")
          PY

      - name: Encode transparent VP9 WebM
        run: |
          ffmpeg -y \
            -framerate 24 \
            -i .hero-motion-frames/f%04d.png \
            -c:v libvpx-vp9 \
            -pix_fmt yuva420p \
            -auto-alt-ref 0 \
            -b:v 0 \
            -crf 30 \
            -deadline good \
            -cpu-used 2 \
            web/public/art/hero-launch.webm

      - name: Verify render
        run: |
          test -s web/public/art/hero-launch.webm
          test -s web/public/art/hero-launch-poster.webp
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,pix_fmt,duration \
            -of default=noprint_wrappers=1 \
            web/public/art/hero-launch.webm

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/art/hero-launch.webm web/public/art/hero-launch-poster.webp
          if git diff --cached --quiet; then
            echo "Rendered assets unchanged"
            exit 0
          fi
          git commit -m "fix(web): render hero art matched to SoT"
          git push origin HEAD:web/hero-art-match-sot
