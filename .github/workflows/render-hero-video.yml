name: Render hero video

on:
  push:
    branches:
      - web/rendered-hero-video
    paths:
      - web/scripts/render_hero.py
      - web/public/art/rocket-layers/**
      - .github/workflows/render-hero-video.yml

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip hero render]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: web/rendered-hero-video
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render transparent VP9 hero
        run: |
          python web/scripts/render_hero.py
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,pix_fmt:format=duration,size \
            -of default=noprint_wrappers=1 \
            web/public/art/hero-launch.webm

      - name: Commit rendered asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/art/hero-launch.webm
          if git diff --cached --quiet; then
            echo 'Rendered asset unchanged.'
            exit 0
          fi
          git commit -m 'web: render hero launch video [skip hero render]'
          git push origin HEAD:web/rendered-hero-video
